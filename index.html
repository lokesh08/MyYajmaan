<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, description, canonical, Open Graph, Twitter and JSON-LD are
         generated from src/seo/* by vite-plugins/seo.js. Do not edit
         between the markers; change src/seo/routes.js instead. -->
    <!--seo:head--><!--/seo:head-->

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="application-name" content="MyYajmaan" />
    <meta name="apple-mobile-web-app-title" content="MyYajmaan" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Fonts: connect early and load with <link> (not a CSS @import, which
         blocks rendering until the stylesheet chain resolves). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--seo:noscript--><!--/seo:noscript-->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
